<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>momoyu</title>
  <link rel="stylesheet" href="css/popup.css">
</head>

<body>
  <header class="header">
    <div class="brand">
      <img class="logo" src="assets/icon.png" alt="">
      <div class="brand-text">
        <div class="brand-name">搜索助手</div>
        <div class="brand-desc">摸鱼防老板工具</div>
      </div>
    </div>
    <button type="button" class="about">GitHub</button>
  </header>

  <section class="panel">
    <div class="row">
      <div class="row-text">
        <div class="row-title">全局模式</div>
        <div class="row-desc status-tip">开启后对所有网页标签生效</div>
      </div>
      <button type="button" class="switch-open switch" role="switch" aria-checked="false" aria-label="全局模式">
        <span class="switch-knob"></span>
      </button>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label for="input-fake">虚拟页面</label>
      <input id="input-fake" class="input-fake" type="url" placeholder="留空 = 内置百度伪装页">
      <p class="field-hint">多数网站已禁止被嵌入（frame-ancestors），自定义地址经常会加载失败。不确定时请留空。</p>
    </div>
  </section>

  <script src="js/fake-url.js"></script>
  <script src="js/popup.js"></script>
</body>

</html>
